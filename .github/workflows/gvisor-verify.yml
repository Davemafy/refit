name: Verify gVisor Containment

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sandbox_runner.py'
      - 'tests/test_refit_sandbox.py'
      - 'scripts/sandbox_tool_gateway.py'
      - 'scripts/sandbox_tool_worker.py'
      - 'tests/test_refit_tool_gateway.py'
      - 'deploy/install-gvisor.sh'
      - '.github/workflows/gvisor-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gvisor-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install upstream signed gVisor package (systrap)
        run: sudo bash deploy/install-gvisor.sh

      - name: Record registered runtime and gVisor version
        run: |
          set -euo pipefail
          command -v runsc
          runsc --version
          docker info --format '{{json .Runtimes}}'
          docker pull python:3.11-alpine

      - name: Execute real gVisor sandbox integration tests
        env:
          REFIT_TEST_DOCKER: '1'
          REFIT_TEST_RUNTIME: 'runsc'
        run: python -m unittest tests.test_refit_sandbox.RealDockerContainmentTests -v

      - name: Capture and assert independent gVisor evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m scripts.sandbox_runner --fixture safe --runtime runsc > artifacts/gvisor-safe.json
          python -m scripts.sandbox_runner --fixture hostile --runtime runsc > artifacts/gvisor-hostile.json
          python - <<'PY'
          import json
          for name in ('safe', 'hostile'):
              with open('artifacts/gvisor-' + name + '.json') as fp:
                  r = json.load(fp)
              assert r['runtime'] == 'runsc', r['runtime']
              assert r['container_created'], r
              assert r['container_removed_verified'], r
              assert r['ledger_valid'], r
              assert r['status'] == 'passed', r
              if name == 'hostile':
                  probes = json.loads(r['stdout'])
                  assert probes['key_file'] == 'FileNotFoundError', probes
                  assert probes['key_in_env'] is False, probes
                  for name_ in ('dns', 'outbound_connection', 'root_write'):
                      assert not probes[name_].startswith('unexpectedly'), probes
              print(name, 'verified:', r['runtime'], r['duration_ms'], 'ms')
          PY

      - name: Verify complete agent migration through gVisor-isolated business tools
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.sandbox_tool_gateway import migrate_in_tool_sandboxes
          from tests.test_refit_deployment import ScriptedResponder
          result = migrate_in_tool_sandboxes(
              ScriptedResponder(break_target=True),
              "deployment", "source", "target", "repair",
              seed=888, runtime="runsc",
          )
          bound = result["execution_boundary"]
          assert result["status"] == "verified_adaptation", result["status"]
          assert result["source_training"]["passed"] == 8
          assert result["target_training"]["passed"] < 8
          assert result["validation"]["passed"] == 8
          assert result["repaired_holdout"]["passed"] == 8
          assert bound["runtime"] == "runsc"
          assert bound["business_tools_isolated"]
          assert bound["all_containers_removed"]
          assert bound["worker_runs"] > 32
          assert all(c["runtime"] == "runsc" and c["network"] == "none" and c["container_absent"] for c in bound["cases"])
          artifact = {
              "kind": "full_migration_in_gvisor",
              "model_mode": "scripted_offline_provider_not_real_vultr_inference",
              "status": result["status"],
              "source_training": result["source_training"],
              "target_training": result["target_training"],
              "validation": result["validation"],
              "repaired_holdout": result["repaired_holdout"],
              "execution_boundary": bound,
              "limitation": "The built-in synthetic deployment agent and sandbox-side business verifier ran in gVisor. This is not external-agent support or a separately protected business oracle.",
          }
          Path("artifacts/gvisor-full-migration.json").write_text(json.dumps(artifact, indent=2) + "\n")
          print("Full gVisor agent workflow verified:", bound["worker_runs"], "isolated workers")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refit-gvisor-containment-evidence
          path: artifacts/gvisor-*.json
          retention-days: 7
