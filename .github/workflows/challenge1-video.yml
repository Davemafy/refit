name: Record Challenge 1 evidence on production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/refit-host-request.json'

permissions:
  contents: read

concurrency:
  group: c1-production-video
  cancel-in-progress: true

jobs:
  evidence-film:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployed revision and actual Vultr host containment
        env:
          REFIT_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base="https://80.240.30.92"
          expected=os.environ["REFIT_EXPECTED_REVISION"]
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(base+"/api/application/release",timeout=8) as stream:
                      release=json.load(stream)
                  with urllib.request.urlopen(base+"/api/application/containment-proof",timeout=8) as stream:
                      proof=json.load(stream)
                  if (release.get("revision")==expected and
                      proof.get("revision")==expected and proof.get("verified") is True and
                      len(proof.get("attempts",[]))==5 and
                      all(v["blocked"] is True for v in proof["attempts"])):
                      print("Verified production release and all host prohibitions:",expected)
                      break
              except (OSError, ValueError, KeyError):
                  pass
              if attempt==35:
                  raise SystemExit("Matching production revision and host containment receipt unavailable")
              time.sleep(5)
          PY
      - name: Install Chromium for production film
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record genuine public production evidence at 1440p
        env:
          REFIT_URL: https://80.240.30.92
          REFIT_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/c1_demo_capture.mjs
      - name: Encode readable 1080p submission MP4
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
          test -s artifacts/challenge1-video/frames.ffconcat
          ffmpeg -hide_banner -loglevel error -y -safe 0 -f concat \
            -i artifacts/challenge1-video/frames.ffconcat \
            -vf "fps=30,scale=1920:1080:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset medium -crf 15 -maxrate 18M -bufsize 32M \
            -movflags +faststart -an \
            artifacts/challenge1-video/refit-vultr-containment-1080p.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 artifacts/challenge1-video/refit-vultr-containment-1080p.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 artifacts/challenge1-video/refit-vultr-containment-1080p.mp4)" = "1080"
          test "$(stat -c %s artifacts/challenge1-video/refit-vultr-containment-1080p.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 artifacts/challenge1-video/refit-vultr-containment-1080p.mp4
      - name: Preserve recorded evidence and quality frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-challenge1-evidence-film
          path: |
            artifacts/challenge1-video/refit-vultr-containment-1080p.mp4
            artifacts/challenge1-video/proof-frame.png
            artifacts/challenge1-video/timeline.json
            artifacts/challenge1-video/evidence.json
            artifacts/challenge1-video/failure-frame.png
          if-no-files-found: warn
          retention-days: 14
