name: Verify application import and containment
on:
  push:
    branches: [main]
    paths:
      - 'scripts/application*.py'
      - 'scripts/smoke_application.py'
      - 'integrations/application/**'
      - 'experiments/ai-sdk-file-agent/**'
      - 'scripts/verify_application_typescript.py'
      - 'scripts/refit_vultr_probe.py'
      - 'web/application/**'
      - 'tests/browser_application*.mjs'
      - 'tests/browser_saas.mjs'
      - 'tests/saas_fixture_server.py'
      - 'tests/test_refit_saas_routes.py'
      - 'tests/test_refit_github_pin.py'
      - 'deploy/launch-application.sh'
      - 'deploy/launch-platform-https.sh'
      - '.github/workflows/application.yml'
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the application sandbox
        run: |
          bash -n deploy/launch-application.sh
          bash -n deploy/launch-platform-https.sh
          sudo bash deploy/install-gvisor.sh
          docker build -f integrations/application/Dockerfile -t refit-application .
      - name: Verify upstream TypeScript tool loop and fresh export with a zero-inference test broker
        run: |
          bash experiments/ai-sdk-file-agent/prepare.sh /tmp/refit-ai-sdk-agent.zip
          python -m scripts.verify_application_typescript /tmp/refit-ai-sdk-agent.zip experiments/ai-sdk-file-agent/setup.json
      - name: Verify HTTP import and disposable containment without inference
        env:
          REFIT_APPLICATION_TOKEN: test-only-operator-application-ci-token
        run: |
          python -m scripts.application_http --state /tmp/refit-application-http &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --max-time 2 -fsS http://127.0.0.1:8098/bring >/dev/null; then break; fi
            sleep 1
          done
          python -m scripts.smoke_application
          python -m scripts.verify_application_sandbox
      - name: Verify Firefox cancellation, restart recovery and quota without inference
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
          node tests/browser_application_controls.mjs
      - name: Verify SaaS routes and review in Firefox without inference
        run: node tests/browser_saas.mjs
      - name: Archive zero-inference SaaS browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-saas-browser-views
          path: artifacts/saas-ui/
          retention-days: 3
          if-no-files-found: ignore
