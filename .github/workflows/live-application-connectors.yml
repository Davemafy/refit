name: One-shot paid connector acceptance
on:
  push:
    branches: [main]
    paths:
      - 'ops/connector-acceptance.json'
permissions:
  contents: read
concurrency:
  group: refit-paid-connector-acceptance
  cancel-in-progress: false
jobs:
  original-application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate the pinned original application through both connector modes
        env:
          VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
        run: |
          python -c 'import json; assert json.load(open("ops/connector-acceptance.json")) == {"run_live": True, "max_requests": 16}'
          python -m scripts.acceptance_connectors --authorize-requests 16 --output /tmp/refit-connector-acceptance.json
      - name: Preserve acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-paid-connector-acceptance
          path: /tmp/refit-connector-acceptance.json
          if-no-files-found: ignore
          retention-days: 7
