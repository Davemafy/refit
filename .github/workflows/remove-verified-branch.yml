name: Remove merged verification branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-verified-branch.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 1 });
            if (!pr.merged || pr.head.ref !== 'fix/require-nonempty-verification' || pr.head.repo.full_name !== context.payload.repository.full_name) {
              throw new Error('Refusing to delete an unmerged or unexpected branch');
            }
            await github.rest.git.deleteRef({ ...context.repo, ref: 'heads/fix/require-nonempty-verification' });
            core.info('Deleted merged verification branch');
