name: Validate genuine refund trial
on:
  push:
    branches: [main]
    paths:
      - scripts/refund_trial.py
      - scripts/application_http.py
      - integrations/samples/refund_agent.py
      - tests/test_refit_refund_trial.py
      - web/application/app.js
      - .github/workflows/refund-trial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and client syntax
        run: |
          python -m compileall -q scripts/refund_trial.py scripts/application_http.py integrations/samples/refund_agent.py
          node --check web/application/app.js
      - name: Test actual refund tool boundaries and evaluated sample
        run: |
          python -m unittest tests.test_refit_refund_trial -v
          python -m unittest tests.test_refit_public_trial -v
