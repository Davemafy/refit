name: Verify public Vultr service

# Read-only external acceptance on every main commit. The SHA below is
# deliberately the deployed service release, not the latest source HEAD.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_application_revision:
        description: Full Git SHA of the deployed HTTPS application
        type: string
        required: false

concurrency:
  group: public-vultr-acceptance-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real public API and downloadable repair evidence
        run: |
          python -m scripts.smoke_public \
            --url http://80.240.30.92 \
            --expected-revision e53feebd8f6d1d08595d23d3b0794aa814c60841 \
            --require-live-rejection \
            --output /tmp/refit-public-smoke.json
      - name: Verify the deployed HTTPS application without inference
        env:
          EXPECTED_APPLICATION_REVISION: ${{ inputs.expected_application_revision || '91ef79194cc7b28315461793fdcb8b363f22a3d3' }}
        run: |
          python -m scripts.smoke_platform_https \
            --url https://80.240.30.92 \
            --expected-revision "$EXPECTED_APPLICATION_REVISION" \
            --output /tmp/refit-https-smoke.json
      - name: Preserve external observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-public-vultr-smoke
          path: |
            /tmp/refit-public-smoke.json
            /tmp/refit-https-smoke.json
          retention-days: 7
          if-no-files-found: ignore
