name: Verify public Vultr service

# Push checks verify the actual HTTPS deployment, which may lag the source.
# Exact SHA promotion is asserted separately by the authorized host deploy.
# Operators may request an exact revision check via workflow_dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_application_revision:
        description: Full Git SHA of the deployed HTTPS application
        type: string
        required: false

concurrency:
  group: public-vultr-acceptance-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real public API and downloadable repair evidence
        run: |
          python -m scripts.smoke_public \
            --url http://80.240.30.92 \
            --expected-revision e53feebd8f6d1d08595d23d3b0794aa814c60841 \
            --require-live-rejection \
            --output /tmp/refit-public-smoke.json
      - name: Verify the deployed HTTPS application without inference
        env:
          EXPECTED_APPLICATION_REVISION: ${{ inputs.expected_application_revision || '' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EXPECTED_APPLICATION_REVISION" ]]; then
            [[ "$EXPECTED_APPLICATION_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Expected deployment revision must be a full Git SHA" >&2
              exit 1
            }
            args+=(--expected-revision "$EXPECTED_APPLICATION_REVISION")
          fi
          # The push job may overlap a systemd release handoff.
          # Retry a bounded number of real HTTPS checks; never hide a persistent outage.
          for attempt in $(seq 1 10); do
            if python -m scripts.smoke_platform_https \
                --url https://80.240.30.92 \
                "${args[@]}" \
                --output /tmp/refit-https-smoke.json; then
              echo "HTTPS production smoke passed on attempt $attempt"
              break
            fi
            if (( attempt == 10 )); then
              echo "HTTPS smoke still failing after ten production checks" >&2
              exit 1
            fi
            sleep 8
          done
      - name: Preserve external observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refit-public-vultr-smoke
          path: |
            /tmp/refit-public-smoke.json
            /tmp/refit-https-smoke.json
          retention-days: 7
          if-no-files-found: ignore

  external-workbench:
    needs: external-http
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REFIT_WORKBENCH_URL: https://80.240.30.92
      REFIT_WORKBENCH_OUTPUT: artifacts/production-workbench
    steps:
      - uses: actions/checkout@v4
      - name: Install Firefox for public browser acceptance
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps firefox
      - name: Verify the deployed workspace and capture both themes
        run: node tests/browser_workbench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refit-production-workbench
          path: artifacts/production-workbench/
          retention-days: 7
